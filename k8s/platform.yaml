apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-a-data
  namespace: configsync
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-b-data
  namespace: configsync
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: control-plane-data
  namespace: configsync
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-a
  namespace: configsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-a
  template:
    metadata:
      labels:
        app: storage-a
    spec:
      containers:
        - name: storage-a
          image: configsync:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "storage_service.main:app", "--host", "0.0.0.0", "--port", "8101"]
          env:
            - name: CONFIGSYNC_STORAGE_DIR
              value: /data
          ports:
            - containerPort: 8101
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8101
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8101
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: storage-a-data
---
apiVersion: v1
kind: Service
metadata:
  name: storage-a
  namespace: configsync
spec:
  selector:
    app: storage-a
  ports:
    - port: 8101
      targetPort: 8101
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-b
  namespace: configsync
spec:
  replicas: 1
  selector:
